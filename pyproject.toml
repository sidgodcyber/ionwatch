[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ionwatch"
version = "0.1.0"
description = "Offline ionospheric scintillation pipeline for low-cost GNSS receivers (Android GnssLogger, Quectel L86)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",               # pandas 3 changes datetime resolution (ms vs ns) and breaks merge_asof joins
    "numpy>=1.24",
    "pyarrow>=12",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "click>=8",
    "pyserial>=3.5",
    "jsonschema>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.28",
    "ncompress>=1.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27", "websocket-client>=1.6"]
fixtures = ["hatanaka>=2.8"]       # reference crx2rnx, only to rebuild tests/fixtures/bench

[project.scripts]
ionwatch = "ionwatch.cli:main"

[tool.setuptools.packages.find]
include = ["ionwatch*"]

[tool.setuptools.package-data]
ionwatch = ["minute_record.schema.json", "dashboard/static/*", "dashboard/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
